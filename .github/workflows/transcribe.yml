name: transcribe
on:
  push:
    paths:
      - 'transcribe/**.mp3'
      - 'transcribe/**.wav'
      - 'transcribe/**.m4a'
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-en-wx-v1
      - name: Transcribe new audio
        run: |
          set -e
          pip install -q faster-whisper
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q whisperx || echo 'whisperx install failed, using whisper timings'
          files=$(git diff --name-only --diff-filter=AMR HEAD~1 HEAD | grep -E '^transcribe/.*\.(mp3|wav|m4a)$' || true)
          [ -z "$files" ] && exit 0
          python tools/transcribe.py $files
          git config user.name github-actions
          git config user.email actions@github.com
          git add transcribe
          git commit -m "Add transcripts" || true
          git push
